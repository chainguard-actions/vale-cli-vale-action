name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Vale config and docs in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workdir-test/docs"
          cat > "$GITHUB_WORKSPACE/workdir-test/.vale.ini" <<'EOF'
          StylesPath = styles
          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Vale
          EOF
          cat > "$GITHUB_WORKSPACE/workdir-test/docs/readme.md" <<'EOF'
          # Workdir Test

          This is a test document for workdir testing.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: docs
          workdir: "${{ github.workspace }}/workdir-test"
          sync: "false"
          reporter: "github-pr-annotations"
          fail_on_error: "false"
          filter_mode: "nofilter"

      - name: Assert action ran with custom workdir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom workdir"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
