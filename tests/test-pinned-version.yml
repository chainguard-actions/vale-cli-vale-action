name: Test pinned Vale version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a minimal Vale config in the workspace root
      - name: Set up Vale config
        run: |
          cat > .vale.ini << 'EOF'
          StylesPath = .vale-styles

          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Vale
          EOF
          mkdir -p .vale-styles

      # Create a clean markdown file to lint
      - name: Create test document
        run: |
          mkdir -p docs
          cat > docs/sample.md << 'EOF'
          # Sample Document

          This document tests Vale with a pinned version.
          EOF

      - name: Run Vale action with pinned version
        id: vale-pinned
        uses: .
        with:
          version: "2.15.5"
          files: docs
          reporter: github-check
          fail_on_error: "false"
          level: error
        continue-on-error: true

      - name: Assert action ran with pinned version
        run: |
          echo "Vale action with version=2.15.5 completed"
          echo "PASS: pinned version executed without crashing"
