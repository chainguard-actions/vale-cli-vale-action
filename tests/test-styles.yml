name: Test styles input - install styles prior to running Vale
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Vale config in workspace
        run: |
          # Create a .vale.ini that references the style we will install
          cat > "$GITHUB_WORKSPACE/.vale.ini" << 'EOF'
          StylesPath = .vale-styles
          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Vale
          EOF
          mkdir -p "$GITHUB_WORKSPACE/.vale-styles"

      - id: action
        uses: .
        with:
          # Install the built-in Vale style package before linting
          styles: |
            https://github.com/errata-ai/vale/releases/latest/download/Vale.zip
          files: tests/fixtures
          debug: 'true'
        env:
          # Setting GITHUB_HEAD_REF triggers the fallback path in the action:
          # instead of calling the Checks API (which fails with the sentinel repo),
          # it prints Vale alerts to stdout and exits gracefully.
          GITHUB_HEAD_REF: act-harness
        continue-on-error: true

      - name: Assert action ran with styles input (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with styles input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
