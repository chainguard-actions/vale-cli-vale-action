name: Test Vale with custom flags and specific version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Set up Vale config in workspace
        run: |
          cp tests/fixtures/vale-config/.vale.ini "$GITHUB_WORKSPACE/.vale.ini"

      - name: Run Vale action with custom flags
        id: vale
        uses: .
        with:
          files: "tests/fixtures/docs"
          reporter: "github-check"
          fail_on_error: "false"
          level: "warning"
          filter_mode: "nofilter"
          vale_flags: "--minAlertLevel=error"
        continue-on-error: true

      - name: Assert action completed with custom flags
        run: |
          echo "Vale action with custom flags completed"
          echo "PASS: Vale action ran with vale_flags without crashing the workflow"
