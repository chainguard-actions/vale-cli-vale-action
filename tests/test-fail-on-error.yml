name: Test fail on error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Vale config and sample file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fail-test-docs"
          cat > "$GITHUB_WORKSPACE/fail-test-docs/.vale.ini" <<'EOF'
          StylesPath = styles
          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Vale
          EOF
          cat > "$GITHUB_WORKSPACE/fail-test-docs/sample.md" <<'EOF'
          # Test Document

          This is a test document for fail on error testing.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: fail-test-docs
          config: "${{ github.workspace }}/fail-test-docs/.vale.ini"
          sync: "false"
          reporter: "github-pr-annotations"
          fail_on_error: "true"
          filter_mode: "nofilter"

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_on_error=true, the action may fail if Vale finds issues
          # or if reviewdog fails due to the sentinel repo. Both are acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
