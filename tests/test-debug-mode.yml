name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Vale config and sample file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/debug-test-docs"
          cat > "$GITHUB_WORKSPACE/debug-test-docs/.vale.ini" <<'EOF'
          StylesPath = styles
          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Vale
          EOF
          cat > "$GITHUB_WORKSPACE/debug-test-docs/readme.md" <<'EOF'
          # Debug Test

          This is a test document for debug mode.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: debug-test-docs
          config: "${{ github.workspace }}/debug-test-docs/.vale.ini"
          sync: "false"
          debug: "true"
          reporter: "github-pr-annotations"
          fail_on_error: "false"
          filter_mode: "nofilter"

      - name: Assert action ran in debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully in debug mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully in debug mode (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
