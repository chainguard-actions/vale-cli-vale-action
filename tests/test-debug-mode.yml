name: Test debug mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a minimal Vale config in the workspace root
      - name: Set up Vale config
        run: |
          cat > .vale.ini << 'EOF'
          StylesPath = .vale-styles

          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Vale
          EOF
          mkdir -p .vale-styles

      # Create a clean markdown file to lint
      - name: Create test document
        run: |
          mkdir -p docs
          cat > docs/readme.md << 'EOF'
          # Overview

          This document is used for testing Vale in debug mode.
          EOF

      - name: Run Vale action with debug enabled
        id: vale-debug
        uses: .
        with:
          files: docs
          debug: "true"
          reporter: github-check
          fail_on_error: "false"
          level: error
        continue-on-error: true

      - name: Assert action ran in debug mode
        run: |
          echo "Vale action with debug=true completed"
          echo "PASS: debug mode executed without crashing"
