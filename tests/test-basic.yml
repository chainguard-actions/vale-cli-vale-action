name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Vale config and test content
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/vale-config/.vale.ini" "$GITHUB_WORKSPACE/.vale.ini"
          mkdir -p "$GITHUB_WORKSPACE/styles"
          mkdir -p "$GITHUB_WORKSPACE/docs"
          cp "$GITHUB_WORKSPACE/tests/fixtures/docs/test.md" "$GITHUB_WORKSPACE/docs/test.md"

      - id: action
        uses: .
        with:
          files: docs
          reporter: local
          fail_on_error: "false"
          filter_mode: "nofilter"
          debug: "true"

      - name: Assert action completed successfully
        run: |
          echo "Action completed without fatal error"
          echo "PASS"
