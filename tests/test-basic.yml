name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Vale config and sample file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vale-test-docs"
          cat > "$GITHUB_WORKSPACE/vale-test-docs/.vale.ini" <<'EOF'
          StylesPath = styles
          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Vale
          EOF
          cat > "$GITHUB_WORKSPACE/vale-test-docs/sample.md" <<'EOF'
          # Sample Document

          This is a sample document for testing Vale linting.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: vale-test-docs
          config: "${{ github.workspace }}/vale-test-docs/.vale.ini"
          sync: "false"
          reporter: "github-pr-annotations"
          fail_on_error: "false"
          filter_mode: "nofilter"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
