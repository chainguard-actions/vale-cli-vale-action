name: Test all files mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Vale config and test content
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/vale-config/.vale.ini" "$GITHUB_WORKSPACE/.vale.ini"
          mkdir -p "$GITHUB_WORKSPACE/styles"

      - id: action
        uses: .
        with:
          files: all
          reporter: local
          fail_on_error: "false"
          filter_mode: "nofilter"
          level: "error"

      - name: Assert action completed without fatal error
        run: |
          echo "Action ran in 'all files' mode successfully"
          echo "PASS"
